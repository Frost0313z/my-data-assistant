name: CI

# 푸시·PR마다 백엔드 테스트와 프론트 스모크를 돌린다.
#
# 배포 차단에 대해: Render와 Vercel은 GitHub 푸시를 보고 **스스로** 배포하므로
# 이 워크플로가 실패해도 배포를 막지는 못한다. 진짜로 막으려면 저장소 설정에서
# main에 브랜치 보호 규칙을 걸고 이 체크를 필수로 지정해야 한다 — 그건 대시보드
# 작업이라 코드로 넣을 수 없다. 그때까지 이 CI는 "깨진 걸 빨리 아는" 장치다.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # 테스트는 Firestore와 OpenAI를 메모리 대역으로 갈아 끼우므로 자격증명이 필요 없다.
      # 빈 값을 명시해 두는 이유는, 어쩌다 진짜를 부르는 코드가 들어오면 조용히
      # 통과하지 않고 여기서 터지게 하려는 것이다.
      - run: pytest
        env:
          OPENAI_API_KEY: ""
          FIREBASE_SERVICE_ACCOUNT_JSON: ""
      # B1: 사전 분석 리포트가 데이터와 어긋나면 AI가 틀린 근거를 댄다.
      # 근거를 대는 것이 이 서비스의 약속이라 그게 제일 나쁜 고장이다.
      - name: 사전 분석 리포트 수치 대조
        run: python scripts/build_insights.py
      # 보안 25: 버전을 고정했으니(24) 이제 "무엇이 깔리는지"가 정해져 있고,
      # 그래야 스캔이 의미를 갖는다. 고정 전에는 매 빌드마다 다른 걸 스캔했다.
      #
      # 실패하면 머지를 막는다. 무시하려면 --ignore-vuln GHSA-xxxx 를 이 줄에 달고
      # **왜 무시하는지 커밋 메시지에 남긴다** — 조용히 끄면 스캔이 없는 것과 같다.
      - name: 의존성 취약점 스캔
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 빌드 단계가 없는 순수 HTML/CSS/JS라 문법 오류를 잡아 줄 도구가 없다.
      # node --check가 그 역할을 한다 — 배포하고 나서 콘솔에서 알게 되는 걸 막는다.
      - name: JS 문법 검사
        run: for f in js/*.js build.js; do node --check "$f"; done
      - name: 빌드 스모크 (플레이스홀더 치환)
        run: node build.js
        env:
          API_BASE_URL: https://example.invalid
      - name: 치환 결과 확인
        run: |
          grep -q "https://example.invalid" js/config.js
          ! grep -q "__API_BASE_URL__" js/config.js
      - name: 마크다운 렌더러 (XSS 포함)
        run: node scripts/check_markdown.js
      - name: 지도 데이터 무결성
        run: node scripts/check_map_data.js
