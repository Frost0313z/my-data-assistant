name: 배포

# Render 자동 배포 대신 **CI가 초록일 때만** 배포한다.
#
# 배경: Render 설정은 autoDeploy=yes인데 배포 이력에 auto 트리거가 한 번도 없다
# (전부 manual·api·service_updated). 2026-09-09 이후 main이 열 번 넘게 움직였는데
# 배포는 멈춰 있었고, 그 사이 "다음 배포에서 채팅이 전부 500이 되는" 커밋이 들어 있었다.
#
# 그래서 연결을 고치는 대신 **여기로 옮긴다.** Render 자동 배포보다 나은 점이 있다 —
# Render는 푸시를 보고 바로 배포하지만, 이 워크플로는 **CI가 통과한 뒤에만** 배포한다.
# 브랜치 보호가 우리 경로(main 직접 푸시)를 구조적으로 못 막는 문제(보안 36)를
# 배포 단계에서 메운다. 빨간 커밋은 프로덕션까지 가지 않는다.
#
# 켜는 법: Render 대시보드 → 서비스 → Settings → Deploy Hook의 URL을 복사해
#   gh secret set RENDER_DEPLOY_HOOK_URL --body "<복사한 URL>"
# 시크릿이 없으면 이 잡은 조용히 건너뛴다(아무것도 깨지 않는다).
#
# **켰다면 Render 쪽 Auto-Deploy는 끈다.** 둘 다 켜 두면 같은 커밋을 두 번 빌드한다.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# 연달아 푸시하면 마지막 것만 배포하면 된다.
concurrency:
  group: deploy-render
  cancel-in-progress: false

jobs:
  render:
    # CI가 실패했으면 배포하지 않는다. 이 줄이 이 워크플로의 존재 이유다.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Render 배포 트리거
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL 시크릿이 없어 건너뜁니다."
            echo "켜려면: gh secret set RENDER_DEPLOY_HOOK_URL --body '<Render Deploy Hook URL>'"
            exit 0
          fi
          echo "배포 대상 커밋: $SHA"
          code=$(curl -sS -X POST -o /dev/null -w '%{http_code}' --max-time 30 "$HOOK")
          echo "deploy hook → HTTP $code"
          case "$code" in
            200|201|202) echo "배포 요청 접수됨" ;;
            *) echo "배포 요청 실패"; exit 1 ;;
          esac
