<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>대전 상권분석 매니저</title>
<meta name="description" content="대전 82개 동 상권 흐름을 AI가 근거와 함께 설명합니다." />
<meta property="og:type" content="website" />
<meta property="og:locale" content="ko_KR" />
<meta property="og:site_name" content="대전 상권분석 매니저" />
<meta property="og:title" content="대전 상권분석 매니저" />
<meta property="og:description" content="대전 82개 동 상권 흐름을 AI가 근거와 함께 설명합니다." />
<!-- 선언이 없으면 브라우저가 /favicon.ico를 찾다가 404를 남긴다.
     SVG 하나로 끝낸다 — 래스터 아이콘 세트를 만들 이유가 없다. -->
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" crossorigin />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
<script>
  // A32: 그리기 전에 테마를 정한다. 바디 끝 스크립트에서 하면 라이트로 한 번
  // 그려졌다가 어두워지는 깜빡임이 보인다. 그래서 여기 인라인으로 둔다.
  //
  // 저장된 선택이 있으면 그걸 쓰고, 없으면 OS 설정을 따른다. 즉 버튼을 한 번도
  // 안 누른 사람에게는 예전(자동)과 똑같이 동작한다.
  (function () {
    var dark = false;
    try {
      var saved = localStorage.getItem("theme_v1");
      dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    } catch (e) { /* 사생활 보호 모드 */ }
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
</head>
<body>
<!-- F1: 키보드 사용자는 지도 툴바(셀렉트 5개 + 버튼 4개)를 전부 지나야 채팅에 닿는다.
     건너뛸 길을 첫 번째 탭 정지점으로 둔다. -->
<a class="skip-link" href="#chat-input">채팅 입력으로 건너뛰기</a>
<header class="workspace-header">
  <h1>대전 상권분석 매니저</h1>
  <!-- A30: 목적 선택은 지도 위 상시 노출에서 이 버튼이 여는 플로팅 패널로 옮겼다.
       현재 고른 목적이 라벨에 실린다 — 예전의 '둘러보는 중 · 바꾸기' 한 줄을 대신한다. -->
  <!-- A32: 라벨은 "지금 상태"가 아니라 "누르면 일어날 일"이다(디자인 시스템 §글쓰기).
       텍스트는 tabs.js가 채운다 — 초기값을 HTML에 박으면 저장된 선택과 어긋난다. -->
  <button id="theme-toggle" class="theme-toggle" aria-pressed="false"></button>
  <button id="persona-panel-toggle" aria-controls="pane-persona" aria-expanded="false">목적 고르기</button>
  <button id="data-panel-toggle" aria-controls="pane-side" aria-expanded="false">데이터·대화 기록</button>
  <button id="chat-panel-toggle" aria-controls="pane-chat" aria-expanded="true">AI 채팅</button>
</header>
<div class="layout">
  <!-- 좌: 요약 · 대화 기록 · 데이터 관리 -->
  <aside class="sidebar" id="pane-side">
    <h2>데이터·대화 기록</h2>

    <section class="panel">
      <h2>데이터 요약</h2>
      <div id="summary-content" class="summary-box">불러오는 중...</div>
    </section>

    <section class="panel">
      <h2>대화 기록</h2>
      <ul id="history-list" class="history-list"></ul>
    </section>

    <details class="panel data-manage">
      <summary>데이터 관리</summary>
      <form id="data-form" class="data-form">
        <input name="date" type="date" required />
        <input name="value" type="number" step="any" placeholder="값" required />
        <input name="memo" type="text" placeholder="메모" />
        <button type="submit">추가</button>
      </form>
      <div class="data-table-wrap">
        <table class="data-table"><caption class="sr-only">저장된 데이터 목록. 날짜·값·메모와 삭제 버튼</caption>
          <thead>
            <tr><th>날짜</th><th>값</th><th>메모</th><th>동작</th></tr>
          </thead>
          <tbody id="data-tbody"></tbody>
        </table>
      </div>
    </details>
  </aside>

  <!-- A30: 목적 선택 패널. `데이터·대화 기록`과 같은 **비모달** 플로팅 패널이다 —
       배경 막도 aria-modal도 없고 뒤쪽을 계속 조작할 수 있다. A28의 "게이트로
       만들지 않는다"를 지키는 방식이 이것이다. 첫 방문(persona_v1 미설정)에만
       자동으로 열리고, 그 뒤에는 헤더 버튼으로 언제든 다시 연다. -->
  <aside class="persona-panel" id="pane-persona" aria-labelledby="persona-title">
    <h2 class="persona-title" id="persona-title">무엇이 궁금하세요?</h2>
    <p class="persona-lead">고른 목적에 맞춰 지도 지표와 제안 질문이 바뀝니다. 나중에 바꿔도 됩니다.</p>
    <div id="persona-list" class="persona-list" role="group" aria-label="목적 선택"></div>
    <button id="persona-skip" class="persona-skip">닫고 지도 보기</button>
  </aside>

  <!-- 중앙: 분석 주제 버튼 + 상세 (사전 분석 리포트 스냅샷) -->
  <main class="topics-pane" id="pane-dashboard">
    <div class="pane-header">
      <h2>대전 상권 지도</h2>
      <!-- ↗는 장식이 아니라 "새 창에서 열린다"는 정보다. 다만 낭독기는 이걸
           "북동쪽 화살표"로 읽어 소음이 된다. 기호는 감추고 말로 대신한다. -->
      <a id="dashboard-open" href="#" target="_blank" rel="noopener">전체 대시보드 <span aria-hidden="true">↗</span><span class="sr-only">(새 창에서 열림)</span></a>
    </div>
    <section class="map-explorer" aria-label="대전 상권 지도">
      <div class="map-toolbar">
        <label>지표 <select id="map-metric" disabled aria-label="지도 지표"></select></label>
        <label>기준 시점 <select id="map-period" disabled aria-label="지도 기준 시점"></select></label>
        <label>업종 점 <select id="map-category" disabled aria-label="업종 점 표시"><option value="">표시 안 함</option></select></label>
        <label>자치구 <select id="map-district" disabled aria-label="지도 자치구"><option value="">대전 전체</option></select></label>
        <label>행정동 <select id="map-dong" disabled aria-label="지도 행정동"><option value="">지도에서 선택</option></select></label>
        <div class="map-view-toggle" role="group" aria-label="지도 표현 방식">
          <button data-map-view="2d" aria-pressed="false" disabled>2D</button>
          <button data-map-view="3d" aria-pressed="true" disabled>3D</button>
        </div>
        <button id="map-reset" disabled>대전 전체 보기</button>
      </div>
      <!-- 지도 위에 둔다. 아래에 있으면 지도를 다 본 뒤에야 결과가 눈에 들어와
           확인이 늦다. 무대 순서 자체는 비용이 0이다 — .map-stage만 flex:1 1 auto라
           형제들의 순서를 바꿔도 높이 배분이 그대로다.
           고르기 전에는 "어느 동이 궁금하세요?"가 지도를 누르라는 안내가 되고,
           고른 뒤에는 같은 자리가 답(A31의 Display)이 된다. -->
      <div class="map-selection" aria-live="polite">
        <!-- A31: 이 무대의 Display 자리는 '선택한 동의 값'이다. 이름 → 값 → 근거 순서로
             읽히게 세 줄로 나눈다. 지금까지 한 문장에 뭉쳐 있어 수치가 캡션 크기였다. -->
        <div>
          <h3 id="map-selection-name">어느 동이 궁금하세요?</h3>
          <p id="map-selection-value" class="map-selection-value">지도에서 지역을 선택해 주세요</p>
          <p id="map-selection-basis" class="map-selection-basis"></p>
        </div>
        <button id="map-ask" disabled>이 동을 AI에게 질문</button>
      </div>
      <div class="map-stage">
        <div id="daejeon-map" role="region" aria-label="대전 82개 행정동 공급 밀도, 행정동 선택은 위 선택 상자에서도 가능합니다"></div>
        <p id="map-status" class="map-status" role="status">대전 지도를 불러오는 중입니다.</p>
      </div>
      <!-- A23: 지표마다 구간·단위가 달라 map.js가 채운다. -->
      <div class="map-legend" id="map-legend" aria-label="지표 범례"></div>
      <!-- 업종 점을 켠 동안에만 나온다. 상시 노출되는 해설 두 줄(지표 해설·2D/3D 안내)은
           지도 높이를 벌기 위해 걷어냈다. -->
      <p class="map-note" id="map-points-note" hidden></p>
    </section>

    <!-- A27: 분석 패널은 지도와 같은 무대를 나눠 쓴다. 세로로 쌓지 않아 스크롤이 없다. -->
    <section id="topic-detail" class="panel topic-detail" aria-live="polite" hidden></section>


    <!-- A27: 무대 전환 탭. 주제 버튼은 topics.js가 #topic-list에 채운다. -->
    <nav class="analysis-tabs" aria-label="분석 무대 선택">
      <button id="stage-map-tab" class="topic-btn" aria-pressed="true">지도</button>
      <div id="topic-list" class="topic-list" role="group" aria-label="분석 주제 선택"></div>
    </nav>
  </main>

  <!-- 우: 채팅 -->
  <section class="chat-pane" id="pane-chat">
    <div class="pane-header">
      <h2>AI 상권 분석</h2>
      <button id="chat-new" class="ghost">새 대화</button>
    </div>
    <div id="screen-context" class="screen-context" hidden></div>
    <div id="chat-messages" class="chat-messages" aria-live="polite" aria-relevant="additions" aria-atomic="false"></div>
    <div id="chat-suggestions" class="chat-suggestions"></div>
    <div class="chat-input-row">
      <input id="chat-input" type="text" aria-label="AI에게 보낼 질문" placeholder="주제를 고르고 물어보세요 (예: 이 주제 핵심이 뭐야?)" />
      <button id="chat-send">보내기</button>
    </div>
  </section>
</div>

<!-- 모바일 하단 탭 -->
<nav class="tabbar" id="tabbar" hidden>
  <button data-pane="pane-dashboard" class="active">지도</button>
  <button data-pane="pane-chat">채팅</button>
  <button data-pane="pane-side">데이터</button>
</nav>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/markdown.js"></script>
<script src="js/topics-data.js"></script>
<script src="js/topics.js"></script>
<script src="js/tabs.js"></script>
<script src="js/summary.js"></script>
<script src="js/chat.js"></script>
<script src="js/data.js"></script>
<script src="js/history.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="js/map.js"></script>
</body>
</html>
