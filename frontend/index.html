<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>대전 상권 분석 AI 비서</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="layout">
  <!-- 좌: 요약 · 대화 기록 · 데이터 관리 -->
  <aside class="sidebar" id="pane-side">
    <h1>대전 상권 분석 AI 비서</h1>

    <section class="panel">
      <h2>데이터 요약</h2>
      <div id="summary-content" class="summary-box">불러오는 중...</div>
    </section>

    <section class="panel">
      <h2>대화 기록</h2>
      <ul id="history-list" class="history-list"></ul>
    </section>

    <details class="panel data-manage">
      <summary>데이터 관리</summary>
      <form id="data-form" class="data-form">
        <input name="date" type="date" required />
        <input name="value" type="number" step="any" placeholder="값" required />
        <input name="memo" type="text" placeholder="메모" />
        <button type="submit">추가</button>
      </form>
      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>날짜</th><th>값</th><th>메모</th><th>동작</th></tr>
          </thead>
          <tbody id="data-tbody"></tbody>
        </table>
      </div>
    </details>
  </aside>

  <!-- 중앙: 대전 상권 인터랙티브 대시보드 (분석 저장소 산출물 임베드) -->
  <main class="dashboard-pane" id="pane-dashboard">
    <div class="pane-header">
      <h2>상권 대시보드</h2>
      <a id="dashboard-open" href="#" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>
    </div>
    <div class="dashboard-frame-wrap">
      <div id="dashboard-status" class="frame-status">대시보드를 불러오는 중...</div>
      <iframe id="dashboard-frame" title="대전 상권 인터랙티브 대시보드" loading="lazy"></iframe>
    </div>
  </main>

  <!-- 우: 채팅 -->
  <section class="chat-pane" id="pane-chat">
    <div class="pane-header">
      <h2>AI 상권 분석</h2>
      <button id="chat-new" class="ghost">새 대화</button>
    </div>
    <div id="screen-context" class="screen-context" hidden></div>
    <div id="chat-messages" class="chat-messages"></div>
    <div id="chat-suggestions" class="chat-suggestions"></div>
    <div class="chat-input-row">
      <input id="chat-input" type="text" placeholder="지금 보고 있는 화면에 대해 물어보세요" />
      <button id="chat-send">보내기</button>
    </div>
  </section>
</div>

<!-- 모바일 하단 탭 -->
<nav class="tabbar" id="tabbar" hidden>
  <button data-pane="pane-dashboard" class="active">대시보드</button>
  <button data-pane="pane-chat">채팅</button>
  <button data-pane="pane-side">데이터</button>
</nav>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/dashboard-bridge.js"></script>
<script src="js/tabs.js"></script>
<script src="js/summary.js"></script>
<script src="js/chat.js"></script>
<script src="js/data.js"></script>
<script src="js/history.js"></script>
</body>
</html>
